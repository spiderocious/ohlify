# Codemagic CI for apps/mobile (Expo / React Native) inside this pnpm + Nx monorepo.
#
# Key monorepo facts this config has to respect:
#  - This file MUST live at the repo root (Codemagic only looks here), but every
#    mobile command runs from apps/mobile. Codemagic has no global "working
#    directory" for a workflow, so each script cd's in explicitly.
#  - pnpm install must run at the ROOT (workspace protocol: @ohlify/mobile depends
#    on @ohlify/api, @ohlify/core, @ohlify/mobile-ui via "workspace:*").
#  - .npmrc sets node-linker=hoisted, which Metro requires. Do not override it.
#  - apps/mobile/android and /ios are gitignored (managed Expo workflow), so CI
#    must run `expo prebuild` to generate them before any native build. Always
#    pass --platform: a bare prebuild generates BOTH platforms and the Firebase
#    plugin then fails on the missing iOS GoogleService-Info.plist.
#  - google-services.json is gitignored and injected from a secure env var.

definitions:
  # NOTE: versions are written out in full in each workflow rather than shared
  # via a YAML merge key (`<<: *anchor`). Merge keys are not reliably expanded
  # here, which silently leaves node/pnpm unset and falls back to whatever the
  # build image defaults to. Keep the two blocks in sync by hand.
  scripts:
    - &install_deps
      name: Install workspace dependencies (pnpm, from repo root)
      script: |
        # corepack pins the exact pnpm from package.json's packageManager field.
        corepack enable
        corepack prepare pnpm@9.15.9 --activate
        pnpm install --frozen-lockfile

    - &write_env_file
      name: Write apps/mobile/.env from Codemagic env vars
      script: |
        # EXPO_PUBLIC_* vars are inlined into the JS bundle by Metro at build
        # time. They are public by definition (extractable from the APK), but
        # they live in a Codemagic variable group so changing an API URL does
        # not require a commit.
        cat > apps/mobile/.env <<EOF
        EXPO_PUBLIC_API_BASE_URL=$EXPO_PUBLIC_API_BASE_URL
        EXPO_PUBLIC_FILE_SERVICE_URL=$EXPO_PUBLIC_FILE_SERVICE_URL
        EXPO_PUBLIC_APP_ENV=$EXPO_PUBLIC_APP_ENV
        EXPO_PUBLIC_USE_MOCKS=$EXPO_PUBLIC_USE_MOCKS
        EXPO_PUBLIC_PAYSTACK_CALLBACK_URL=$EXPO_PUBLIC_PAYSTACK_CALLBACK_URL
        EXPO_PUBLIC_CALL_APP_URL=$EXPO_PUBLIC_CALL_APP_URL
        EOF
        echo "Wrote apps/mobile/.env with $(grep -c . apps/mobile/.env) vars"

    - &write_google_services
      name: Restore google-services.json (gitignored; FCM client config)
      script: |
        # Stored base64 in a secure Codemagic env var because the repo is public.
        # app.config.ts references ./google-services.json and the
        # @react-native-firebase/app plugin fails prebuild without it.
        if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
          echo "GOOGLE_SERVICES_JSON_BASE64 is not set — add it to the 'ohlify_mobile_secrets' group"
          exit 1
        fi
        echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > apps/mobile/google-services.json
        node -e "JSON.parse(require('fs').readFileSync('apps/mobile/google-services.json','utf8'));console.log('google-services.json restored and valid')"

    - &verify
      name: Typecheck and lint apps/mobile
      script: |
        cd apps/mobile
        pnpm run typecheck
        pnpm run lint

    - &accept_sdk_licenses
      name: Accept Android SDK licenses
      script: |
        # Expo/AGP resolve compileSdk 36 at prebuild time. Codemagic images ship
        # the SDK but an unaccepted license fails the first build. On the macOS
        # images sdkmanager is not on PATH, so look it up under the SDK root.
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/programs/android-sdk-macosx}}"
        SDKMANAGER="$(command -v sdkmanager || true)"
        if [ -z "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -1)"
        fi
        if [ -n "$SDKMANAGER" ]; then
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          echo "Accepted Android SDK licenses via $SDKMANAGER"
        else
          echo "sdkmanager not found; relying on pre-accepted licenses in the image"
        fi

    - &prebuild_android
      name: Expo prebuild (Android native project)
      script: |
        cd apps/mobile
        # --platform android is REQUIRED, not an optimization. A bare
        # `expo prebuild` also generates iOS, and the @react-native-firebase/app
        # plugin then aborts with "Path to GoogleService-Info.plist is not
        # defined" because app.config.ts only sets android.googleServicesFile
        # (there is no iOS Firebase config yet).
        # --clean gives a deterministic project each run (android/ is gitignored).
        # --no-install because pnpm already installed at the workspace root.
        npx expo prebuild --clean --no-install --platform android

workflows:
  # ---------------------------------------------------------------------------
  # Android — start here. Needs no Apple account, so it is the fastest path to a
  # green build. Produces a signed APK (preview) you can install directly.
  # ---------------------------------------------------------------------------
  android-preview:
    name: Android Preview (APK)
    # mac_mini_m1 is the instance available on the free plan (linux_x2 and the
    # larger macs require a paid plan). Android builds fine on macOS — it just
    # burns the shared 500 free macOS minutes/month.
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      node: 22.14.0
      # No `pnpm:` key here — Codemagic's environment block only accepts
      # node/java/xcode/cocoapods/flutter/ruby. pnpm 9.15.9 is pinned by
      # corepack in the install script instead.
      java: 17
      groups:
        - ohlify_mobile_public   # EXPO_PUBLIC_* vars
        - ohlify_mobile_secrets  # GOOGLE_SERVICES_JSON_BASE64
      # Uncomment once you upload a keystore in Codemagic (Settings > Code signing
      # identities > Android keystores) with the reference name below.
      # android_signing:
      #   - ohlify_upload_keystore
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - $HOME/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      # Only rebuild when mobile-relevant code changes — skips backend-only pushes.
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'apps/mobile'
          - 'packages'
          - 'pnpm-lock.yaml'
          - 'codemagic.yaml'
    scripts:
      - *install_deps
      - *write_env_file
      - *write_google_services
      - *verify
      - *accept_sdk_licenses
      - *prebuild_android
      - name: Build Android APK
        script: |
          cd apps/mobile/android
          # JDK 17 is REQUIRED. React Native 0.86 + AGP fail on JDK 21/26 with
          # "Failed to transform core-for-system-modules.jar ... JdkImageTransform"
          # (reproduced locally on JDK 26; the same build passes on 17).
          # This runs on a macOS instance, so resolve the JDK with java_home
          # rather than `readlink -f`, which BSD coreutils does not support.
          if [ -x /usr/libexec/java_home ]; then
            export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          fi
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          case "$("$JAVA_HOME/bin/java" -version 2>&1)" in
            *'version "17'*) echo "JDK 17 confirmed" ;;
            *) echo "ERROR: expected JDK 17, aborting"; exit 1 ;;
          esac
          # assembleRelease produces an installable APK. Switch to bundleRelease
          # (and change the artifact glob) when you are ready to ship to Play.
          ./gradlew assembleRelease --no-daemon
    artifacts:
      # Verified locally: build lands at app/build/outputs/apk/release/app-release.apk (~103 MB).
      - apps/mobile/android/app/build/outputs/**/*.apk
      - apps/mobile/android/app/build/outputs/**/*.aab
      # mapping.txt only exists once minifyEnabled is on; a glob that matches
      # nothing is not a build failure in Codemagic.
      - apps/mobile/android/app/build/outputs/mapping/**/mapping.txt
    publishing:
      email:
        recipients:
          - adenijiadewale12@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # iOS — requires an Apple Developer account connected in Codemagic. Left as a
  # separate workflow so a missing Apple setup can never break Android.
  # ---------------------------------------------------------------------------
  ios-preview:
    name: iOS Preview (IPA)
    # Free-plan instance (mac_mini_m2 requires a paid plan).
    instance_type: mac_mini_m1
    max_build_duration: 90
    environment:
      node: 22.14.0
      # See the android-preview note: pnpm is pinned via corepack, not here.
      xcode: latest
      cocoapods: default
      groups:
        - ohlify_mobile_public
        - ohlify_mobile_secrets
      # Requires an App Store Connect API key added under
      # Settings > Code signing identities. Uncomment when ready.
      # ios_signing:
      #   distribution_type: ad_hoc
      #   bundle_identifier: com.ohlify.ohlify
    cache:
      cache_paths:
        - $HOME/.pnpm-store
        - $HOME/Library/Caches/CocoaPods
    # No `triggering:` block on purpose — this workflow is MANUAL-ONLY (start it
    # from the Codemagic UI). It cannot succeed until two things exist:
    #   1. apps/mobile/GoogleService-Info.plist (add an iOS app in the Firebase
    #      console, then set ios.googleServicesFile in app.config.ts and inject
    #      the plist here the same way google-services.json is injected).
    #   2. An Apple Developer account + App Store Connect key in Codemagic.
    # Auto-triggering it on every push to main would just email a failure each time.
    scripts:
      - name: Check iOS prerequisites
        script: |
          # Fail fast with an actionable message instead of dying deep inside
          # the Firebase config plugin ~8 steps later.
          if ! grep -q "googleServicesFile" <(sed -n '/ios: {/,/},/p' apps/mobile/app.config.ts); then
            echo "app.config.ts has no ios.googleServicesFile."
            echo "iOS Firebase is not configured yet — see the comment above this workflow."
            exit 1
          fi
      - *install_deps
      - *write_env_file
      - *write_google_services
      - name: Expo prebuild (iOS native project)
        script: |
          cd apps/mobile
          npx expo prebuild --clean --no-install --platform ios
      - *verify
      - name: Install CocoaPods dependencies
        script: |
          cd apps/mobile/ios
          pod install
      - name: Set up provisioning profiles
        script: |
          # No-op unless ios_signing above is uncommented; keychain is
          # pre-populated by Codemagic when signing is configured.
          xcode-project use-profiles || echo "No provisioning profiles configured yet — skipping"
      - name: Build iOS IPA
        script: |
          cd apps/mobile/ios
          # Scheme/workspace name derives from app.config.ts `name: 'Ohlify'`
          # (matches android/settings.gradle rootProject.name = 'Ohlify').
          xcode-project build-ipa \
            --workspace "Ohlify.xcworkspace" \
            --scheme "Ohlify"
    artifacts:
      - apps/mobile/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - feranmidev@gmail.com
        notify:
          success: true
          failure: true

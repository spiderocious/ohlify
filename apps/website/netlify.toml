[build]
  base = "apps/website"
  # Netlify's own install step already installs all 11 workspace projects.
  # Do NOT run a second `pnpm install --filter ...` here: the root .npmrc
  # sets `node-linker=hoisted` (required by Metro/Expo for apps/mobile), so
  # every project shares ONE flat node_modules tree. A filtered install
  # prunes that shared tree (-232 packages), which pulled React out from
  # under the Next prerender worker => "Cannot read properties of null
  # (reading 'useRef')" on /404. Just build.
  command = "pnpm --filter @ohlify/website build"
  publish = ".next"

# Native Next.js support on Netlify. The plugin handles middleware,
# image optimization, and route hashing automatically. No additional
# redirects/headers blocks needed — the marketing site's middleware
# owns the share-slug → ohlify-web.netlify.app hop.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
